<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto — Nébula Arcade</title>
  <meta name="description" content="Formulario de contacto de Nébula Arcade.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="encabezado">
    <div class="contenedor encabezado__barra">
      <a href="index.html" class="logo">NÉBULA<span>·</span>ARCADE</a>
      <button class="nav__toggle" aria-expanded="false" aria-controls="menu-principal">☰</button>
      <nav aria-label="Navegación principal">
        <ul class="nav__lista" id="menu-principal">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="about.html">Acerca de</a></li>
          <li><a href="catalog.html">Catálogo</a></li>
          <li><a href="contact.html" aria-current="page">Contacto</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="seccion">
      <div class="contenedor">
        <h1 class="seccion__titulo">Contacto</h1>
        <p class="seccion__intro">
          ¿Preguntas sobre el proyecto o sugerencias de juegos para el catálogo? Escribe aquí.
        </p>

        <form class="formulario" id="form-contacto" novalidate>
          <div class="campo">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" name="nombre" data-requerido required minlength="3" placeholder="Ej: Ana Pérez">
            <span class="error" id="nombre-error" aria-live="polite"></span>
          </div>

          <div class="campo">
            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" name="correo" data-requerido required placeholder="nombre@dominio.com">
            <span class="error" id="correo-error" aria-live="polite"></span>
          </div>

          <div class="campo">
            <label for="asunto">Asunto</label>
            <select id="asunto" name="asunto" data-requerido required>
              <option value="">Selecciona una opción</option>
              <option value="sugerencia">Sugerir un videojuego</option>
              <option value="soporte">Reportar un problema</option>
              <option value="otro">Otro</option>
            </select>
            <span class="error" id="asunto-error" aria-live="polite"></span>
          </div>

          <div class="campo">
            <label for="mensaje">Mensaje</label>
            <textarea id="mensaje" name="mensaje" data-requerido required minlength="10" placeholder="Cuéntanos brevemente..."></textarea>
            <span class="error" id="mensaje-error" aria-live="polite"></span>
          </div>

          <button type="submit" class="boton boton--primario">Enviar mensaje</button>
          <p class="mensaje-envio" id="mensaje-envio" role="status"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="pie">
    <div class="contenedor pie__contenido">
      <p>© 2026 Nébula Arcade — Proyecto académico de César.</p>
      <nav aria-label="Enlaces del pie de página">
        <a href="contact.html">Contacto</a>
      </nav>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/contacto.js"></script>
</body>
</html>
